name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov black ruff
        pip install -e .

    - name: Lint with ruff
      run: |
        ruff check control_plane/ tests/

    - name: Format check with black
      run: |
        black --check control_plane/ tests/

    - name: Run unit tests
      run: |
        pytest tests/test_state_transitions.py tests/test_policy_enforcement.py tests/test_no_silent_execution.py -v --cov=control_plane --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  stress-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    - name: Run stress tests
      run: |
        pytest tests/test_runtime_stress.py -v -m stress --tb=short
      timeout-minutes: 10

    - name: Upload stress test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: stress-test-report
        path: |
          stress_results.log
          STRESS_TEST_REPORT.md

  benchmark:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run benchmarks
      run: |
        python benchmarks/simple_run_benchmark.py

    - name: Run examples
      run: |
        python examples/demo_agent_run.py
