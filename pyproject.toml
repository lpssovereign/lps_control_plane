[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control-plane"
version = "0.1.0"
description = "Reference runtime for governed AI-agent execution"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["ai", "agent", "governance", "state-machine", "policy", "audit"]
authors = [
  {name = "Lalo Pacheco Sánchez"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black>=23.0",
  "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/lpssovereign/lps_control_plane"
Repository = "https://github.com/lpssovereign/lps_control_plane"
Issues = "https://github.com/lpssovereign/lps_control_plane/issues"

[tool.setuptools.packages.find]
include = ["control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers"
markers = [
  "stress: resource-intensive stress and load tests",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
